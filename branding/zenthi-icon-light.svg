<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main orb gradient - vibrant for light backgrounds -->
    <radialGradient id="orbGradLight" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4B8FF"/>
      <stop offset="30%" stop-color="#B58CFF"/>
      <stop offset="65%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6C3AE0"/>
    </radialGradient>

    <!-- Secondary blue accent -->
    <radialGradient id="blueAccent" cx="65%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#64C7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#64C7FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner glow -->
    <radialGradient id="innerGlowLight" cx="40%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#E8DBFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B58CFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.3"/>
    </filter>

    <!-- Specular -->
    <radialGradient id="specLight" cx="38%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#64C7FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- White/light background -->
  <rect width="512" height="512" rx="115" fill="#FAFAFE"/>

  <!-- Orbital ring -->
  <ellipse cx="256" cy="240" rx="140" ry="48" fill="none" stroke="url(#ringLight)" stroke-width="1.5" opacity="0.4" transform="rotate(-15, 256, 240)"/>

  <!-- Main orb -->
  <circle cx="256" cy="240" r="95" fill="url(#orbGradLight)" filter="url(#shadow)"/>

  <!-- Blue accent -->
  <circle cx="256" cy="240" r="95" fill="url(#blueAccent)"/>

  <!-- Inner glow -->
  <circle cx="256" cy="240" r="95" fill="url(#innerGlowLight)"/>

  <!-- Specular highlight -->
  <ellipse cx="235" cy="210" rx="40" ry="30" fill="url(#specLight)" opacity="0.8"/>

  <!-- Small specular dot -->
  <circle cx="220" cy="198" r="8" fill="white" opacity="0.9"/>

  <!-- Wordmark - dark for light bg -->
  <text x="256" y="410" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="300" letter-spacing="12" fill="#1a1025" opacity="0.9">zenthi</text>

  <!-- Accent dot -->
  <circle cx="256" cy="440" r="2" fill="#B58CFF" opacity="0.7"/>
</svg>